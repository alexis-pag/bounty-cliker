<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inscription - Bounty Clicker</title>
<link rel="stylesheet" href="css/css-desktop.css" media="screen and (min-width: 769px)">
<link rel="stylesheet" href="css/css-mobile.css" media="screen and (max-width: 768px)">
</head>
<body>
<div class="bg-animated"></div>
<div class="layout" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
  <div class="panel active" style="max-width: 500px; width: 95%; display: flex !important; animation: fadeIn 0.8s ease-out; padding: 45px;">
    <h1 style="color: var(--neon-pink); text-align: center; margin-bottom: 35px;">Inscription</h1>
    <form id="regForm">
      <input type="text" id="regUser" placeholder="Pseudo (Nom affiché)" required minlength="3" style="margin-bottom: 18px;">
      <input type="email" id="regEmail" placeholder="Email" required style="margin-bottom: 18px;">
      <input type="password" id="regPass" placeholder="Mot de passe" required minlength="6" style="margin-bottom: 18px;">
      <input type="password" id="regPassConfirm" placeholder="Confirmer le mot de passe" required minlength="6" style="margin-bottom: 25px;">
      <button type="submit" id="regBtn" class="btn activate" style="width: 100%; margin-top: 15px; padding: 14px;">S'inscrire</button>
    </form>
    
    <div style="margin: 30px 0; display: flex; align-items: center; justify-content: center; gap: 15px;">
      <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
      <span style="font-size: 12px; opacity: 0.6;">OU</span>
      <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
    </div>
    
    <button id="googleBtn" class="btn" style="background: white; color: #444; display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 14px;">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Continuer avec Google
    </button>
    
    <p style="text-align: center; margin-top: 30px;">Déjà inscrit ? <a href="login.html" style="color: var(--neon-pink); text-decoration: none; font-weight: bold;">Connexion</a></p>
    <p id="regError" style="color:#ff4d6e; font-weight: bold; margin-top: 10px; text-align: center;"></p>
  </div>
</div>

<style>
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
</style>

<script type="module">
  import { register, loginWithGoogle } from './js/auth.js';

  document.getElementById('regForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('regUser').value;
    const email = document.getElementById('regEmail').value;
    const pass = document.getElementById('regPass').value;
    const passConfirm = document.getElementById('regPassConfirm').value;
    const errorEl = document.getElementById('regError');

    errorEl.textContent = "";

    if (pass !== passConfirm) {
      errorEl.textContent = "Les mots de passe ne correspondent pas.";
      return;
    }

    try {
      const btn = document.getElementById('regBtn');
      btn.disabled = true;
      btn.textContent = "Inscription...";
      await register(email, pass, username);
      alert('Inscription réussie ! Un email de confirmation vous a été envoyé. Veuillez vérifier votre boîte de réception avant de vous connecter.');
      window.location.href = 'login.html';
    } catch (error) {
      const btn = document.getElementById('regBtn');
      btn.disabled = false;
      btn.textContent = "S'inscrire";
      console.error("Erreur d'inscription détaillée:", error);
      if (error.code === 'auth/email-already-in-use') {
        errorEl.textContent = "Cet email est déjà utilisé.";
      } else if (error.code === 'auth/weak-password') {
        errorEl.textContent = "Le mot de passe est trop faible (6 caractères min).";
      } else if (error.code === 'auth/invalid-email') {
        errorEl.textContent = "L'adresse email n'est pas valide.";
      } else if (error.code === 'auth/too-many-requests') {
        errorEl.textContent = "Trop de tentatives échouées. Veuillez patienter quelques instants.";
      } else if (error.code === 'permission-denied') {
        errorEl.textContent = "Accès refusé. Vérifiez les règles de sécurité Firestore.";
      } else {
        errorEl.textContent = `Erreur : ${error.message || "Une erreur est survenue lors de l'inscription."}`;
      }
    }
  });

  document.getElementById('googleBtn').addEventListener('click', async () => {
    const errorEl = document.getElementById('regError');
    errorEl.textContent = "";
    try {
      await loginWithGoogle();
      window.location.href = 'dashboard.html';
    } catch (error) {
      errorEl.textContent = "Échec de la connexion avec Google.";
    }
  });
</script>
</body>
</html>
