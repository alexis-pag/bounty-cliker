<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounty Game – PC</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/autoclick-warning.css">
<style> .game-layout { opacity: 0; } </style>
</head>
<body>

<div class="bg-animated"></div>
<div class="game-layout">
  <div class="panel clicker">
    <div class="panel-header">
      <h1>Bounty</h1>
      <div class="counters">
        <span id="counter">0</span>
        <span id="cps">CPS: 0</span>
        <span id="rebirthInfo">Rebirths: 0</span>
        <span id="prestigeInfo">Prestige: 0</span>
      </div>
    </div>
    <div class="rebirth-container" style="text-align: center; margin-bottom: 20px;">
      <button id="rebirthButton" class="btn activate">Rebirth (1,000,000)</button>
    </div>
    <div class="image-wrap">
      <img id="image" src="image/bounty.jpg" alt="Bounty">
    </div>
    
    <div class="progress-section" style="margin-top: 30px; padding: 0 40px;">
      <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; font-weight: bold; color: var(--neon-blue);">
        <span>Objectif Rebirth</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg" style="height: 12px; background: rgba(255,255,255,0.05); border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
        <div id="progressBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-blue), #6effff); box-shadow: 0 0 15px var(--neon-blue); transition: width 0.3s ease;"></div>
      </div>
    </div>
  </div>

  <div class="panel shop">
    <div class="panel-header">
      <h2>Shop</h2>
    </div>
    <div class="shop-scroll list" id="shopList"></div>
  </div>

  <div class="panel boosts">
    <div class="panel-header">
      <h2>Boosts</h2>
    </div>
    <div class="boosts-scroll list" id="boostList"></div>
  </div>

  <div class="panel prestige-tree">
    <div class="panel-header">
      <h2>Arbre de Prestige</h2>
    </div>
    <div class="prestige-scroll list" id="prestigeTree"></div>
  </div>
</div>

<footer class="bottom-bar">
  <button id="saveButton" class="btn buy" style="margin-right: 10px;">Sauvegarder</button>
  <button id="resetButton" class="btn reset">Réinitialiser le jeu</button>
</footer>

<!-- Boutons en haut à gauche -->
<div style="position:fixed; top:10px; left:10px; z-index: 1000; display: flex; gap: 10px;">
  <button class="btn buy" onclick="window.location.href='leaderboard.html'">Classement</button>
  <button class="btn activate" onclick="window.location.href='market.html'">Bourse</button>
</div>

<!-- Boutons en haut à droite -->
<div style="position:fixed; top:10px; right:10px; display: flex; gap: 10px; z-index: 1000;">
  <button class="btn btn-secondary" onclick="resetChoice()">Menu</button>
  <button class="btn btn-logout" onclick="window.logout()">Déconnexion</button>
</div>

<script type="module" src="js/main.js"></script>
<script src="js/boutique.js"></script>
<script src="js/boost.js"></script>
<script src="js/prestige.js"></script>
<script>
  // Fonction pour revenir au menu de choix
  function resetChoice() {
    localStorage.removeItem("bc-version");
    window.location.href = "index.html";
  }
</script>

</body>
</html>
