<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Bounty Clicker - Mobile</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/autoclick-warning.css">
  <style> .game-layout { opacity: 0; } </style>
</head>
<body>

<a href="https://github.com/alexis-pag/paglierusco-alexis" id="githubButton" target="_blank">code source</a>

<div class="bg-animated"></div>

<div class="game-layout">
  <section class="panel clicker">
    <header class="panel-header">
      <h1>Bounty Clicker</h1>
      <div class="counters">
        <div id="counter">Croquettes : 0</div>
        <div id="cps">CPS : 0</div>
        <div id="prestigeInfo">Prestige : 0</div>
      </div>
    </header>
    <main class="panel-main">
      <div class="image-wrap">
        <img id="image" src="image/bounty.jpg" alt="Bounty">
      </div>
      
      <div class="progress-section" style="margin-top: 15px; padding: 0 20px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.8rem; font-weight: bold; color: var(--neon-blue);">
          <span>Rebirth</span>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar-bg" style="height: 10px; background: rgba(255,255,255,0.05); border-radius: 5px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1);">
          <div id="progressBar" style="height: 100%; width: 0%; background: linear-gradient(90deg, var(--neon-blue), #6effff); box-shadow: 0 0 10px var(--neon-blue); transition: width 0.3s ease;"></div>
        </div>
      </div>
    </main>
  </section>

  <aside class="panel shop" id="shopPanel">
    <header class="panel-header" id="shopHeader">
      <h2>Boutique</h2>
    </header>
    <div class="panel-main" id="shopContent">
      <div id="storeItems" class="list shop-scroll"></div>
    </div>
  </aside>

  <aside class="panel boosts">
    <header class="panel-header"><h2>Boosts & Bonus</h2></header>
    <div class="panel-main">
      <div id="boostsContainer" class="list boosts-scroll"></div>
    </div>
  </aside>

  <aside class="panel prestige-tree">
    <header class="panel-header"><h2>Prestige</h2></header>
    <div class="panel-main">
      <div id="prestigeTree" class="list prestige-scroll"></div>
    </div>
  </aside>
</div>

<div id="rebirthContainer">
  <button id="rebirthButton">Rebirth</button>
  <div id="rebirthInfo">Rebirths : 0</div>
</div>

<footer class="bottom-bar">
  <button id="saveButton" class="btn buy" style="margin-right: 10px;">Save</button>
  <button id="resetButton" class="btn reset">Reset</button>
</footer>

<!-- Boutons en haut à gauche -->
<div style="position:fixed; top:10px; left:10px; z-index:999; display: flex; gap: 5px;">
  <button class="btn buy" style="padding: 6px 10px;" onclick="window.location.href='leaderboard.html'">Trophée</button>
  <button class="btn activate" style="padding: 6px 10px;" onclick="window.location.href='market.html'">Bourse</button>
</div>

<!-- Boutons en haut à droite -->
<div style="position:fixed; top:10px; right:10px; z-index:999; display: flex; gap: 5px;">
  <button class="btn btn-secondary" onclick="resetChoice()">Menu</button>
  <button class="btn btn-logout" onclick="window.logout()">Log out</button>
</div>

<script src="js/boutique.js" defer></script>
<script src="js/boost.js" defer></script>
<script src="js/prestige.js" defer></script>
<script type="module" src="js/main.js" defer></script>

<script>
  // Fonction pour revenir au menu de choix
  function resetChoice() {
    localStorage.removeItem("bc-version");
    window.location.href = "index.html";
  }

  document.addEventListener('DOMContentLoaded', () => {
    const shopPanel = document.getElementById('shopPanel');
    const shopHeader = document.getElementById('shopHeader');
    shopPanel.classList.remove('open');
    shopHeader.addEventListener('click', () => {
      shopPanel.classList.toggle('open');
    });

    // Redirection automatique si le choix mobile est déjà enregistré
    const savedChoice = localStorage.getItem("bc-version");
    if (savedChoice === "desktop") {
      window.location.href = "site.html";
    } else if (savedChoice === "mobile") {
      // reste sur cette page, choix déjà enregistré
      localStorage.setItem("bc-version", "mobile");
    }
  });
</script>

</body>
</html>
