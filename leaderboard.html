<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classement - Bounty Clicker</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .leaderboard-container {
            max-width: 800px;
            margin: 40px auto;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.2);
            border: 1px solid rgba(0, 212, 255, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        th {
            color: var(--neon-blue);
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }
        .rank {
            font-weight: bold;
            width: 60px;
        }
        .rank-1 { color: #ffd700; font-size: 1.2em; }
        .rank-2 { color: #c0c0c0; }
        .rank-3 { color: #cd7f32; }
        .score {
            color: var(--neon-green);
            font-weight: bold;
            text-align: right;
        }
        .username {
            font-weight: 500;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    
    <div class="layout" style="display: block; opacity: 1;">
        <div class="leaderboard-container">
            <div class="header-actions">
                <h1>Classement Mondial</h1>
                <button class="btn btn-secondary" onclick="window.history.back()">Retour</button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th class="rank">Rang</th>
                        <th>Joueur</th>
                        <th style="text-align: right;">Score (Croquettes)</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <tr>
                        <td colspan="3" style="text-align: center; padding: 40px;">Chargement du classement...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { listenToLeaderboard } from './js/database.js';

        const tbody = document.getElementById('leaderboardBody');

        listenToLeaderboard((players) => {
            tbody.innerHTML = '';
            
            if (players.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">Aucun joueur pour le moment.</td></tr>';
                return;
            }

            players.forEach((player, index) => {
                const rank = index + 1;
                const tr = document.createElement('tr');
                
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                tr.innerHTML = `
                    <td class="rank ${rankClass}">#${rank}</td>
                    <td class="username">${player.username || 'Anonyme'}</td>
                    <td class="score">${Math.floor(player.score).toLocaleString()}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    </script>
</body>
</html>
