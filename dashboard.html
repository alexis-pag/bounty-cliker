<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de bord - Bounty Clicker</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .container {
            max-width: 500px;
            width: 90%;
            margin: 40px auto;
            text-align: center;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .user-info {
            margin-bottom: 30px;
            font-size: 1.1em;
            color: rgba(255,255,255,0.8);
        }
        .actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            padding: 16px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.2);
        }
        .btn-primary {
            background: linear-gradient(90deg, #ff4d6e, #ff758c);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 110, 0.2);
        }
        .btn-secondary {
            background: linear-gradient(90deg, var(--neon-blue), #2962ff);
            color: white;
            box-shadow: 0 10px 20px rgba(0, 212, 255, 0.1);
        }
        .btn-trading {
            background: rgba(255,255,255,0.05);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-logout {
            background: transparent;
            color: rgba(255,255,255,0.4);
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="bg-animated"></div>
    <div class="layout" style="height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="container">
            <h1 style="color: var(--neon-blue); margin-bottom: 10px;">Bounty Hub</h1>
            <div class="user-info" id="userInfo">
                Chargement...
            </div>
            
            <div class="actions">
                <button class="btn btn-secondary" id="playMobile">📱 JOUER (MOBILE)</button>
                <button class="btn btn-primary" id="playDesktop">💻 JOUER (DESKTOP)</button>
                <button class="btn btn-trading" id="openTrading">💹 MARCHÉ BOURSIER</button>
                <button class="btn btn-logout" id="logoutBtn">DÉCONNEXION</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { checkAuth, logout } from './js/auth.js';
        import { loadUserData } from './js/database.js';

        checkAuth(async (user) => {
            const userInfoEl = document.getElementById('userInfo');
            
            try {
                const data = await loadUserData(user.uid);
                const username = data?.profile?.username || user.displayName || user.email.split('@')[0];
                
                userInfoEl.innerHTML = `
                    <div style="font-size: 1.4rem; color: var(--neon-blue); font-weight: bold; margin-bottom: 5px;">
                        Bienvenue, ${username} !
                    </div>
                    <div style="font-size: 0.9rem; opacity: 0.6; margin-bottom: 20px;">
                        ${user.email}
                    </div>
                `;

                if (data && data.gameData) {
                    const stats = document.createElement('div');
                    stats.style.cssText = "background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05);";
                    stats.innerHTML = `
                        <div style="display: flex; justify-content: space-around;">
                            <div>
                                <div style="font-size: 0.8rem; opacity: 0.5;">CROQUETTES</div>
                                <div style="font-size: 1.2rem; color: #fff;">${Math.floor(data.gameData.count).toLocaleString()}</div>
                            </div>
                            <div>
                                <div style="font-size: 0.8rem; opacity: 0.5;">REBIRTHS</div>
                                <div style="font-size: 1.2rem; color: #ffd700;">${data.gameData.rebirths || 0}</div>
                            </div>
                        </div>
                    `;
                    userInfoEl.appendChild(stats);
                }
            } catch (error) {
                console.error("Erreur lors du chargement des stats:", error);
                userInfoEl.textContent = `Connecté en tant que : ${user.email}`;
            }
        });

        document.getElementById('playDesktop').addEventListener('click', () => {
            localStorage.setItem("bc-version", "desktop");
            window.location.href = 'site.html';
        });

        document.getElementById('playMobile').addEventListener('click', () => {
            localStorage.setItem("bc-version", "mobile");
            window.location.href = 'site-mobile.html';
        });

        document.getElementById('openTrading').addEventListener('click', () => {
            window.location.href = 'market.html';
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await logout();
        });
    </script>
</body>
</html>
