<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bounty Clicker – Accueil</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div style="text-align:center; margin-top:100px; color: #e6f7ff; font-family: sans-serif;">
  <h1>Bounty Clicker</h1>
  <div id="status" style="margin-top: 20px;">Chargement du jeu...</div>
</div>

<script type="module">
  import { checkAuth } from './js/auth.js';
  
  const statusEl = document.getElementById('status');
  
  // checkAuth redirigera automatiquement vers login.html si pas de session
  checkAuth((user) => {
    if (user) {
      statusEl.textContent = "Authentifié ! Redirection...";
      window.location.href = "dashboard.html";
    }
  }, true);
</script>

</body>
</html>
