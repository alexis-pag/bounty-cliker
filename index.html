<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bounty Clicker - Le jeu incrémental ultime. Collectez des croquettes et évoluez !">
  <title>Bounty Clicker – Accueil</title>
  <!-- Responsive CSS Loading -->
  <link rel="stylesheet" href="css/css-desktop.css" media="screen and (min-width: 769px)">
  <link rel="stylesheet" href="css/css-mobile.css" media="screen and (max-width: 768px)">
</head>
<body>
<div class="bg-animated" aria-hidden="true"></div>

<main class="layout" style="height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;">
  <section class="panel active" role="region" aria-labelledby="main-title" style="max-width: 550px; width: 90%; padding: 60px; border-top: 4px solid var(--neon-blue); display: flex !important; flex-direction: column; animation: fadeIn 1s ease-out;">
    <h1 id="main-title" style="font-size: 3.5rem; margin-bottom: 20px; color: var(--neon-blue);">BOUNTY</h1>
    <h2 style="font-size: 1.2rem; color: #e6f7ff; margin-bottom: 45px; letter-spacing: 6px; opacity: 0.8; text-transform: uppercase;">Clicker Evolution</h2>
    
    <!-- Status message for ARIA live region -->
    <div id="status" role="status" aria-live="polite" style="margin-bottom: 30px; font-weight: bold; min-height: 24px;">Initialisation...</div>
    
    <div id="actionArea" style="display: none;">
        <button class="btn buy" 
                onclick="window.location.href='login.html'" 
                style="padding: 18px 50px; font-size: 1.2rem; border-radius: 12px;"
                aria-label="Se connecter au jeu">
          SE CONNECTER POUR JOUER
        </button>
        <p style="margin-top: 30px; opacity: 0.6;">Ou créez un compte en quelques secondes</p>
    </div>
  </section>
</main>

<style>
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script type="module">
  import { checkAuth } from './js/auth.js';
  
  const statusEl = document.getElementById('status');
  const actionArea = document.getElementById('actionArea');
  
  // checkAuth manages automatic redirection if session is active
  checkAuth((user) => {
    if (user) {
      statusEl.textContent = "Authentifié ! Redirection...";
      
      // Automatic device detection for optimized experience
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!localStorage.getItem("bc-version")) {
        localStorage.setItem("bc-version", isMobile ? "mobile" : "desktop");
      }

      setTimeout(() => {
        const choice = localStorage.getItem("bc-version");
        if (choice === "mobile") window.location.href = "site-mobile.html";
        else window.location.href = "dashboard.html";
      }, 800); // Slightly faster redirection
    } else {
      statusEl.textContent = "";
      actionArea.style.display = "block";
    }
  }, false);
</script>

</body>
</html>
